name: Build and Release

on:
  push:
    tags:
      - 'v*' # vから始まるタグ（例: v1.0.0）がプッシュされた時に実行

permissions:
  contents: write # リリースを作成するために書き込み権限が必要

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # 使用しているNode.jsのバージョンに合わせて調整可能
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build project
        run: npm run build

      - name: Zip build output
        run: zip -r dist.zip dist # distフォルダをzipに圧縮

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist.zip # 圧縮したzipファイルをリリースに添付
          generate_release_notes: true # コミットメッセージから自動でリリースノートを生成